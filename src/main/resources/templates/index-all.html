<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Course</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/customize.css}" rel="stylesheet">

</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container" >

  <!-- Carousel -->
  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <!-- Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="Slide 4"></button>
    </div>

    <!-- Carousel Items -->
    <div class="carousel-inner">
      <!-- Slide 1 -->
      <div class="carousel-item active">
        <img th:src=@{/img/template1.jpg} class="d-block w-100" alt="Image 1">
        <div class="carousel-caption d-none d-md-block">
          <h5>Tiêu đề 1</h5>
          <p>Đây là mô tả cho ảnh 1.</p>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item">
        <img th:src=@{/img/template2.jpg} class="d-block w-100" alt="Image 2">
        <div class="carousel-caption d-none d-md-block">
          <h5>Tiêu đề 2</h5>
          <p>Đây là mô tả cho ảnh 2.</p>
        </div>
      </div>

      <!-- Slide 3 -->
      <div class="carousel-item">
        <img th:src=@{/img/template3.jpg} class="d-block w-100" alt="Image 3">
        <div class="carousel-caption d-none d-md-block">
          <h5>Tiêu đề 3</h5>
          <p>Đây là mô tả cho ảnh 3.</p>
        </div>
      </div>

      <!-- Slide 4 -->
      <div class="carousel-item">
        <img th:src=@{/img/template4.jpg} class="d-block w-100" alt="Image 4">
        <div class="carousel-caption d-none d-md-block">
          <h5>Tiêu đề 4</h5>
          <p>Đây là mô tả cho ảnh 4.</p>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div class="pt-1">
    <div class="pt-1">
      <!-- Nút "Tất cả", kiểm tra nếu param.c == null -->
      <a type="button" class="btn"
         th:classappend="${param.c == null ? 'btn-outline-primary' : 'btn-primary'}"
         th:href="@{/home/all}">
        Tất cả
      </a>

      <!-- Danh sách các danh mục -->
      <a th:each="category : ${list_category_all.content}"
         type="button"
         class="btn m-2"
         th:classappend="${  param.c == category.id ? 'btn-outline-primary' : 'btn-primary'}"
         th:href="@{'/home/all?c=' + ${category.id}}"> <span th:text="${category.name}"></span>
      </a>


    </div>

  </div>

  <!--All-->
  <div th:replace="~{fragments/post :: list_post_all}"></div>

  <!--Phổ biến-->
  <div class="row pb-3">
    <a type="button"
       class="btn btn-primary btn-lg btn-block mt-3"
       th:if="${list_post_all.pageNumber + 1 < list_post_all.totalPages}"
       th:href="@{'/home/all?number=' + ${list_post_all.pageNumber+1}}">
      Trang tiếp
    </a>

  </div>


</div>


<div th:replace="~{fragments/nav :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<link th:href="@{/css/font/bootstrap-icons.css}" rel="stylesheet">

<script>
  document.addEventListener('DOMContentLoaded', function() {

      document.querySelectorAll('.dropdown-submenu > a').forEach(function(element) {
          element.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              var submenu = this.nextElementSibling;

              var allSubmenus = document.querySelectorAll('.dropdown-submenu .dropdown-menu');
              allSubmenus.forEach(function(menu) {
                  if (menu !== submenu) {
                      menu.style.display = 'none';
                  }
              });

              if (submenu.style.display === 'block') {
                  submenu.style.display = 'none';
              } else {
                  submenu.style.display = 'block';
              }
          });
      });
  });
</script>

</body>
</html>
