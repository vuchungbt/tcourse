<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Menu -->
        <div class="col-md-3">
            <div class="list-group">
                <a href="#update-password" class="list-group-item list-group-item-action" data-bs-toggle="tab">Cập nhật mật khẩu</a>
                <a href="#update-account" class="list-group-item list-group-item-action" data-bs-toggle="tab">Cập nhật tài khoản</a>
                <a href="#update-info" class="list-group-item list-group-item-action" data-bs-toggle="tab">Cập nhật thông tin</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">
            <div class="tab-content">
                <!-- Update Password -->
                <div class="tab-pane fade" id="update-password">
                    <h3>Cập nhật mật khẩu</h3>
                    <form>
                        <div class="mb-3">
                            <label for="current-password" class="form-label">Mật khẩu cũ</label>
                            <input type="password" class="form-control" id="current-password" placeholder="Nhập mật khẩu cũ">
                        </div>
                        <div class="mb-3">
                            <label for="new-password" class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="new-password" placeholder="Nhập mật khẩu mới">
                        </div>
                        <div class="mb-3">
                            <label for="confirm-password" class="form-label">Nhập lại mật khẩu mới</label>
                            <input type="password" class="form-control" id="confirm-password" placeholder="Nhập lại mật khẩu mới">
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </form>
                </div>

                <!-- Update Account -->
                <div class="tab-pane fade" id="update-account">
                    <h3>Cập nhật tài khoản</h3>
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Nhập email">
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Nhập username">
                        </div>
                        <div class="mb-3">
                            <label for="confirm-password-account" class="form-label">Nhập mật khẩu để xác nhận</label>
                            <input type="password" class="form-control" id="confirm-password-account" placeholder="Nhập mật khẩu">
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </form>
                </div>

                <!-- Update Information -->
                <div class="tab-pane fade" id="update-info">
                    <h3>Cập nhật thông tin</h3>
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên</label>
                            <input type="text" class="form-control" id="name" placeholder="Nhập tên">
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" placeholder="Nhập title">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Nhập description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="intro" class="form-label">Intro</label>
                            <textarea class="form-control" id="intro" rows="2" placeholder="Nhập intro"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="tel" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="tel" placeholder="Nhập số điện thoại">
                        </div>
                        <div class="mb-3">
                            <label for="dob" class="form-label">Ngày sinh</label>
                            <input type="date" class="form-control" id="dob">
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
