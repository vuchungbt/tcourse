<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/customize.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body class="background-radial-gradient overflow-hidden">
<div class="login-container">
    <div class="login-header">
        <h3>F-Course</h3>
        <p th:if="${param.error}" class="text-danger">Tài khoản hoặc mật khẩu không đúng</p>
        <p th:if="${param.logout}"  class="text-success">Đã đăng xuất</p>
        <p th:text="${message}" class="text-info" ></p>
    </div>

    <form method="post"
          role="form"
          th:action="@{/login}">
        <div class="form-floating">
            <input type="text" class="form-control" id="username" name="username"  placeholder="Email">
            <label for="username">Tên tài khoản</label>
        </div>

        <div class="form-floating password-container">
            <input type="password" class="form-control" id="password" name="password"  placeholder="Mật khẩu">
            <label for="password">Mật khẩu</label>
            <span class="position-absolute top-50 end-0 translate-middle-y pe-3" style="cursor: pointer;">
                    <i class="fas fa-eye-slash toggle-password"></i>
                </span>
        </div>

        <button type="submit" class="btn btn-login">
            Đăng nhập
        </button>

        <div class="divider">
            <span > or </span>
        </div>
        <a type="button" class="btn btn-register" href="/dang-ky">Đăng ký</a>

        <a type="button" class="btn btn-google">
            <i class="bi bi-google"></i>
            Đăng nhập với Google
        </a>

        <div class="forgot-password">
            <a href="#">Quên mật khẩu?</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Icon library for stars -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<script>
    // Toggle password visibility
    document.querySelector('.toggle-password').addEventListener('click', function() {
        const passwordInput = document.querySelector('#password');
        const icon = this;

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    });
</script>
</body>
</html>
