<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/customize.css}" rel="stylesheet">

  <style>
    /* Kiểu dáng cho các thẻ tag */
    .tag {
        display: inline-block;
        background-color: #0d6efd;
        color: white;
        padding: 5px 10px;
        border-radius: 15px;
        margin: 5px;
        font-size: 14px;
    }

    .tag .remove-tag {
        margin-left: 8px;
        cursor: pointer;
        color: #ffccd5;
    }

    .tag-input {
        border: none;
        outline: none;
        width: auto;
        flex-grow: 1;
        padding: 5px;
        font-size: 14px;
    }

    .tag-container {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        border: 1px solid #ced4da;
        border-radius: 5px;
        padding: 10px;
    }
  </style>
</head>
<body  style="margin-top:70px">

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5">
  <div class="card bg-white">


  <form th:action="@{/section}" method="post" id="uploadForm" >
    <input type="hidden" name="post_id" th:value="${post.id}">
    <span th:text="${post.id}"></span>
    <div class="row">
      <div class="col-md-6">
<!--        <label for="tag-input" class="form-label">Thêm Thẻ Tag</label>-->
<!--        <div class="tag-container" id="tag-container">-->
<!--          <input type="text" class="tag-input" id="tag-input" placeholder="Nhập thẻ tag... (bắt đầu với #)">-->
<!--        </div>-->
<!--        <input type="hidden" name="tags" id="hidden-tags">-->
        <h4 class="mb-3">Thêm Phần Học</h4>

        <!-- Vùng chứa các thành phần -->

        <div id="component-container"></div>

        <!-- Nút thêm thành phần -->
        <div>
          <button type="button" id="add-component-btn" class="btn btn-success  mb-3">Thêm Thành Phần</button>

        </div>

        <div>
          <button type="submit" id="submit-btn" class="btn btn-primary mb-3 float-end">Hoàn thành</button>

        </div>
      </div>
      <div class="col-md-4">
        <div id="input-container ">

          <!-- Default Input -->
          <label for="category" class="form-label">Danh mục</label>
              <select class="form-select pb-4" id="category" name="category" required>
                <option value="" disabled selected>Chọn danh mục</option>
              </select>
        </div>
      </div>

    </div>


  </form>
  </div>
  <!-- Progress bar -->
  <div class="progress mt-3" style="height: 20px; display: none;" id="upload-progress">
    <div
            class="progress-bar progress-bar-striped progress-bar-animated"
            id="progress-bar"
            role="progressbar"
            style="width: 0%"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
    >
      0%
    </div>
  </div>
</div>



<div th:replace="~{fragments/nav :: footer}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script th:src="@{/js/customize.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<link th:href="@{/css/font/bootstrap-icons.css}" rel="stylesheet">
<script>
  let componentIndex = 0;

// Thêm thành phần mới
document.getElementById("add-component-btn").addEventListener("click", function () {
    const container = document.getElementById("component-container");

    // Tạo một div cho thành phần mới
    const componentDiv = document.createElement("div");
    componentDiv.classList.add("row", "align-items-center", "mb-3");
    componentDiv.setAttribute("data-index", componentIndex);

    // HTML cho thành phần (3 input + 1 file)
    componentDiv.innerHTML = `
        <div class="col-md-2">
            <input type="text" name="components[${componentIndex}].itemOrder" value="${componentIndex+1}" class="form-control" placeholder="Thứ tự" disabled required>
        </div>
        <div class="col-md-4">
            <input type="text" name="components[${componentIndex}].name" class="form-control" placeholder="Tên" required>
        </div>
        <div class="col-md-3">
            <input type="text" name="components[${componentIndex}].description" class="form-control" placeholder="Ghi chú" required>
        </div>
        <div class="col-md-1">
            <button type="button" class="btn btn-danger remove-btn">Xóa</button>
        </div>
    `;

    // Gắn vào container
    container.appendChild(componentDiv);

    // Thêm sự kiện xóa
    componentDiv.querySelector(".remove-btn").addEventListener("click", function () {
        componentDiv.remove();
    });

    componentIndex++;
});

</script>

<script>
  const tagInput = document.getElementById("tag-input");
  const tagContainer = document.getElementById("tag-container");
  const hiddenTags = document.getElementById("hidden-tags");

  let tags = []; // Lưu trữ danh sách các thẻ tag

  // Xử lý khi người dùng nhập
  tagInput.addEventListener("keyup", function (event) {
      const value = tagInput.value.trim();

      // Nếu nhấn phím "space" hoặc "#"
      if ((event.key === " " || event.key === "#") && value !== "") {
          const newTag = value.replace("#", "").trim(); // Loại bỏ dấu #
          if (newTag && !tags.includes(newTag)) {
              tags.push(newTag);
              addTagToContainer(newTag); // Thêm tag vào container
              tagInput.value = ""; // Reset ô input
          }
      }
  });

  // Thêm thẻ tag vào giao diện
  function addTagToContainer(tag) {
      const tagElement = document.createElement("div");
      tagElement.classList.add("tag");
      tagElement.innerHTML = `${tag} <span class="remove-tag">&times;</span>`;

      // Xử lý khi xóa thẻ tag
      tagElement.querySelector(".remove-tag").addEventListener("click", function () {
          removeTag(tag);
          tagContainer.removeChild(tagElement);
      });

      // Thêm thẻ vào container
      tagContainer.insertBefore(tagElement, tagInput);

      updateHiddenInput(); // Cập nhật hidden input
  }

  // Xóa thẻ tag
  function removeTag(tag) {
      tags = tags.filter(t => t !== tag);
      updateHiddenInput(); // Cập nhật hidden input
  }

  // Cập nhật hidden input với danh sách thẻ tag
  function updateHiddenInput() {
      hiddenTags.value = tags.join(",");
  }

  // Xử lý khi submit form
  document.getElementById("tag-form").addEventListener("submit", function (event) {
      if (tags.length === 0) {
          event.preventDefault(); // Ngăn gửi form nếu không có thẻ tag
          alert("Vui lòng nhập ít nhất 1 thẻ tag!");
      }
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
   const categorySelect = document.querySelector('select[name="category"]');

   try {
     const response = await fetch('/api/categories/all');
     const categories = await response.json();

     categories.forEach(category => {
       const option = document.createElement('option');
       option.value = category.id;
       option.textContent = category.name;
       categorySelect.appendChild(option);
     });
   } catch (error) {
     console.error('Lỗi khi tải danh mục:', error);
     categorySelect.innerHTML = '<option>Không thể tải danh mục</option>';
   }
 });
</script>
</body>
</html>
