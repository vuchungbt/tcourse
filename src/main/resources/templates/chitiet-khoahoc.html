<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/customize.css}" rel="stylesheet">

    <style>
        body {
            background-color: #003553;
            color: white;
        }
        
        .breadcrumb-item a {
            color: #fff;
            text-decoration: none;
        }
        
        .breadcrumb-item.active {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .breadcrumb-item + .breadcrumb-item::before {
            color: white;
        }
        
        .rating {
            color: #ffc107;
        }
        
        .price {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .original-price {
            text-decoration: line-through;
            color: #6c757d;
        }
        
        .discount {
            color: #28a745;
        }
        
        .feature-list {
            list-style: none;
            padding-left: 0;
        }
        
        .feature-list li {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
        }
        
        .feature-list i {
            color: #28a745;
            margin-right: 10px;
            margin-top: 4px;
        }
        
        .btn-primary-2th {
            background-color: #e67e22;
            border: none;
            padding: 0.8rem;
            width: 100%;
            margin-bottom: 1rem;
        }
        
        .btn-outline-primary {
            border-color: #e67e22;
            color: #e67e22;
            padding: 0.8rem;
            width: 100%;
        }
        
        .course-info {
            color: #666;
            margin-top: 2rem;
        }
        
        .course-info i {
            margin-right: 0.5rem;
        }
        
        .video-preview {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-preview img {
            width: 100%;
            border-radius: 8px;
        }
        
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: white;
            cursor: pointer;
        }
        
        .info-box {
            background-color: white;
            border-radius: 8px;
            padding: 2rem;
            margin-top: 2rem;
            color: #333;
        }

        .course-header {
            color: #333;
            margin-bottom: 20px;
        }

        .course-stats {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .accordion-button {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 500;
        }

        .accordion-button:not(.collapsed) {
            background-color: #e7f1ff;
            color: #0c63e4;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            color: #333;
            text-decoration: none;
        }

        .lesson-item:last-child {
            border-bottom: none;
        }

        .lesson-item:hover {
            background-color: #f8f9fa;
        }

        .lesson-icon {
            color: #666;
            margin-right: 15px;
        }

        .lesson-title {
            flex-grow: 1;
        }

        .lesson-duration {
            color: #666;
            font-size: 0.9rem;
        }

        .section-info {
            color: #666;
            font-size: 0.9rem;
            float: right;
        }
    </style>
    <style>
        .star-rating {
            display: flex;
            align-items: center;
        }
        .star-rating .stars {
            display: flex;
            margin-left: 10px;
        }
        .star-rating .stars i {
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 1.5rem;
            margin-right: 3px;
        }
        .star-rating .stars i.bi-star-fill {
            color: #ffc107;
        }
        .star-rating .current-rating {
            margin-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body  style="margin-top:70px">

<div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <!-- Breadcrumb -->
<!--        <nav aria-label="breadcrumb">-->
<!--            <ol class="breadcrumb">-->
<!--                <li class="breadcrumb-item"><a href="#">F-Course</a></li>-->
<!--                <li class="breadcrumb-item"><a href="#">Kinh Doanh</a></li>-->
<!--                <li class="breadcrumb-item active">Kinh doanh Online</li>-->
<!--            </ol>-->
<!--        </nav>-->

        <div class="row">
            <!-- Left Column -->
            <div class="col-lg-8">
                <h1 class="mb-4" th:text="${post.name}"> </h1>
                <p class="lead" th:text="${post.description}"></p>
                <p class="lead" th:text="${post.content}"></p>

                <div class="d-flex align-items-center mb-3">
                    <div class="rating me-2">
                        <span th:text="${#numbers.formatDecimal(post.avgVote, 0, 1)}"></span>
                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                            <th:block th:switch="${true}">
                                <i th:case="${post.avgVote >= i}" class="bi bi-star-fill"></i>
                                <i th:case="${post.avgVote > (i-1) and post.avgVote < i}" class="bi bi-star-half"></i>
                                <i th:case="*" class="bi bi-star"></i>
                            </th:block>
                        </th:block>
                    </div>
                    <span th:text="${post.votes.size() + ' Đánh giá'}"></span>
<!--                    <span class="ms-3">239 Học viên</span>-->
                </div>
                
                <p>Giảng viên: <a href="#" class="text-info" th:text="${cre.name}"></a></p>

                <div class="info-box">
                    <h3 class="mb-4">Bạn sẽ học được</h3>
                    <div class="row">
                        <!-- Cột 1 -->
                        <div class="col-md-6">
                            <div th:each="skill, iterStat : ${post.skills}">
                                <div class="d-flex align-items-start mb-3"
                                     th:if="${iterStat.index % 2 == 0}">
                                    <i class="bi bi-check-lg me-2 text-success"></i>
                                    <span th:text="${skill.name}"></span>
                                </div>
                            </div>
                        </div>
                        <!-- Cột 2 -->
                        <div class="col-md-6">
                            <div th:each="skill, iterStat : ${post.skills}">
                                <div class="d-flex align-items-start mb-3"
                                     th:if="${iterStat.index % 2 != 0}">
                                    <i class="bi bi-check-lg me-2 text-success"></i>
                                    <span th:text="${skill.name}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- What you'll learn section -->
                <div class="info-box">
                    <h3 class="mb-4">Nội dung</h3>
                    <div class="course-stats" th:text="${post.sections.size() +'-Phần'}"></div>

                    <div class="accordion" id="courseContent">
                        <!-- Phần 1 -->
                         <div class="accordion-item" th:each="section, iterStat : ${post.sections}">

                            <h2 class="accordion-header" th:id="${'heading' +iterStat.index}">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                        th:attr="data-bs-target=${'#collapse' + (iterStat.index + 1)}">
                                    <span th:text="${'Phần ' + iterStat.count + ': '}"></span>
                                    <span class="section-info" th:text="${section.name}"></span>
                                </button>
                            </h2>
                            <div th:id="${'collapse' +(iterStat.index+1)}"  class="accordion-collapse collapse "
                                 th:classappend="${iterStat.first} ? 'show' : ''"
                                 data-bs-parent="#courseContent">
                                <div class="accordion-body p-0" th:each="item, iterStatx : ${section.items}">
                                    <a href="#" class="lesson-item">
                                        <i class="fas fa-play-circle lesson-icon"></i>
                                        <a class="lesson-title" th:href="@{'/stream/view/' +${item.name}}" th:text="${'Bài '+ (iterStatx.index + 1)+' > ' + item.description }"> </a>
                                        <span class="lesson-duration"  th:text="${item.time}"> </span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info-box">
                    <div class="card" th:each="comment : ${post.comments}">
                        <div class="card-body">
                            <div class="d-flex flex-start align-items-center">
                                <img class="rounded-circle shadow-1-strong me-3"
                                     th:src="@{'/image/' + ${comment.created.avatar}}"
                                     alt="avatar" width="50" height="50">
                                <div>
                                    <h6 class="fw-bold text-primary mb-1" th:text="${comment.created.name}"></h6>
                                    <p class="text-muted small mb-0 timestamps" th:text="${comment.createAt}">
                                    </p>
                                </div>
                            </div>

                            <p class="mt-3 mb-1" th:text="${comment.content}">
                            </p>
                        </div>
                    </div>
                    <div th:if="${user == null}" class="card align-items-center py-1 " >
                        <h5> Đăng nhập để bình luận</h5>
                        <a  th:href="@{/dang-nhap}" class="btn btn-primary">Đăng nhập</a>
                    </div>
                    <div th:if="${user != null}" class="card">
                        <div class="card-footer py-3 border-0" style="background-color: #f8f9fa;">

                            <form th:action="@{/post/comment/create}" method="post" >
                                <div class="d-flex flex-start w-100">
                                    <img class="rounded-circle shadow-1-strong me-3"
                                         th:src="@{'/image/' + ${user.avatar}}" alt="avatar" width="40" height="40">
                                    <div data-mdb-input-init="" class="form-outline w-100">
                                        <textarea
                                                name="content"
                                                class="form-control"
                                                id="textAreaExample"
                                                rows="3"
                                                style="background: #fff;"
                                                placeholder="Nhập bình luận của bạn..."></textarea>
                                        <input type="hidden" name="postId" th:value="${post.id}"/>
                                        <input type="hidden" name="createdId" th:value="${user.id}"/>
                                        <input type="hidden" name="vote" value="0"/>
                                    </div>
                                </div>
                                <div class="float-end mt-2 ">
                                    <button type="submit" data-mdb-button-init=""
                                            data-mdb-ripple-init="" class="btn btn-primary-2th btn-sm">Post comment</button>
                                </div>
                            </form>
                            <script>
                                document.getElementById("voteForm").addEventListener("submit", function(event) {
                                    event.preventDefault();

                                    const stars = document.getElementById("stars").value;
                                    const postId = document.getElementById("postId_").value;

                                    console.log('postId:', postId);
                                    console.log('stars:', stars);

                                    fetch(`/api/course/vote/${postId}?stars=${stars}`, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        }
                                    })
                                    .then(response => {
                                        if (!response.ok) {
                                            throw new Error('Network response was not ok');
                                        }
                                        return response.json();
                                    })
                                    .then(data => {
                                        // Kiểm tra và hiển thị thông báo phù hợp
                                        if (data && data.message) {
                                            alert(data);
                                        } else {
                                            alert('Vote thành công!');
                                        }
                                    })
                                    .catch(error => {
                                        console.error('Error:', error);
                                        alert('Đã có lỗi xảy ra: ' + error);
                                    });
                                });
                            </script>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-4 pt-2">
                <div class="card  position-relative">
                    <img th:src="@{'/image/' +${post.thumbnail}}" class="" height="200px" alt="Product 1">

                    <div class="price-box bg-white p-4 rounded">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="final-price text-dark h5 num"
                                  th:text="${post.finalPrice + ' VND'}"> </span>

                            <div th:if="${post.discountPercent>0 }">
                                <span class="original-price text-decoration-line-through text-muted num"
                                      th:text="${post.price + 'VND'}"> </span>
                                <span class="badge bg-danger discount ms-2 p-2 text-white"
                                      th:text="${post.discountPercent + '%'}"> </span>
                            </div>
                        </div>

                        <button class="btn btn-primary-2th mb-2 add-to-cart-btn"
                                th:data-post-id="${post.id}"
                                th:data-name="${post.name}"
                                th:data-price="${post.finalPrice}"
                                th:data-thumbnail="${post.thumbnail}">THÊM VÀO GIỎ HÀNG</button>
                        <a class="btn btn-outline-primary"  th:href="@{/home/payment}">MUA NGAY</a>

                        <div class="course-info mt-4">
                            <p><i class="bi bi-alarm"></i> <span th:text="${'Phần học: ' + post.sections.size()}"> </span></p>
                            <p><i class="bi bi-play-circle"></i> Giáo trình: <span th:text="${totalItems}">0</span> Bài giảng</p>

                            <p><i class="bi bi-archive"></i></i> Sở hữu khóa học trọn đời</p>
                            <p><i class="bi bi-patch-check"></i></i> Cấp chứng nhận hoàn thành</p>
                        </div>
                        <div class="coupon mt-4">
                            <div>
                                <div class="star-rating">
                                    <span class="current-rating">0.0</span>
                                    <div class="stars">
                                        <i class="bi bi-star" data-rating="1"></i>
                                        <i class="bi bi-star" data-rating="2"></i>
                                        <i class="bi bi-star" data-rating="3"></i>
                                        <i class="bi bi-star" data-rating="4"></i>
                                        <i class="bi bi-star" data-rating="5"></i>
                                    </div>
                                </div>

                                <form id="voteForm">
                                    <input type="hidden" id="postId_" th:value="${post.id}"/>
                                    <input type="hidden" id="selectedStars" name="stars" value="0" required/>
                                </form>
                            </div>
                        </div>


<!--                        <div class="coupon mt-4">-->
<!--                            <input type="text" class="form-control" placeholder="Nhập mã giảm giá">-->
<!--                            <button class="btn btn-outline-primary mt-2">Áp dụng</button>-->
<!--                        </div>-->
                    </div>
                </div>
                <div class="info-box position-relative ">
                    <div class="h-100 text-center position-relative   ">
                        <div class="badge bg-success position-absolute top-0 start-0">Giảng viên</div>
                        <img th:src="@{'/image/' + ${cre.avatar}}" class="container-fluid card-img-top  rounded-circle w-75 "
                             alt="Product 4">
                        <div class="card-body text-dark bg-gradient mt-1">
                            <h5 class="card-title" th:text="${cre.name}"> </h5>
                            <p class="card-text" th:text="${cre.title}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stars = document.querySelectorAll('.stars i');
        const currentRating = document.querySelector('.current-rating');
        const selectedStarsInput = document.getElementById('selectedStars');
        const postId = document.getElementById('postId_').value;

        function updateStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('bi-star');
                    star.classList.add('bi-star-fill');
                } else {
                    star.classList.remove('bi-star-fill');
                    star.classList.add('bi-star');
                }
            });
            currentRating.textContent = rating.toFixed(1);
            selectedStarsInput.value = rating;
        }

        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));

                console.log('rating:', rating);
                console.log('postId:', postId);

                fetch(`/api/course/vote/${postId}?stars=${rating}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    console.log('Full response:', response);
                    console.log('Response status:', response.status);

                    // Quan trọng: Sử dụng .json() để đọc body
                    return response.json();
                })
                .then(data => {
                    // Log toàn bộ dữ liệu nhận được
                    console.log('Parsed data:', data);

                    // Kiểm tra và xử lý dữ liệu
                    if (data.success) {
                        alert(data.message);
                    } else {
                        alert(data.message || 'Có lỗi xảy ra');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    //alert('Đã có lỗi xảy ra: ' + error);
                });
            });

            star.addEventListener('mouseover', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.classList.remove('bi-star');
                        s.classList.add('bi-star-fill');
                    } else {
                        s.classList.remove('bi-star-fill');
                        s.classList.add('bi-star');
                    }
                });
                currentRating.textContent = rating.toFixed(1);
            });

            star.addEventListener('mouseout', function() {
                const currentSelectedRating = parseInt(selectedStarsInput.value);
                updateStars(currentSelectedRating);
            });
        });
    });
</script>
<div class="pt-2" th:replace="~{fragments/nav :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<link th:href="@{/css/font/bootstrap-icons.css}" rel="stylesheet">
<script th:src="@{/js/customize.js}"></script>
</body>
</html>
