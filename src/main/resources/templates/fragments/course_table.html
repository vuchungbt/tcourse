<div th:fragment="posts" class="card mb-4">
    <div class="card-header ">
        <div>
            <i class="fas fa-table me-1"></i>
            Khóa học
        </div>
    </div>

    <div class="card-body">
        <table id="datatablesSimple">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Khuyến mãi(%)</th>
                <th>Người tạo</th>
                <th>Thời gian</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">

                <td th:text="${post.id}"></td>
                <td th:text="${post.name}"></td>
                <td> <span  th:text="${post.price}" class="num"></span></td>
                <td> <span  th:text="${post.discount}" class="num"></span></td>
                <td> <span  th:text="${post.created_by}" class="num"></span></td>
                <td> <span  th:text="${post.createAt}" class="timestamps"></span></td>

<!--                <td>-->
<!--                    <a href="#" class="mx-2 text-danger text-decoration-none"-->
<!--                       data-bs-toggle="modal"-->
<!--                       data-bs-target="#deletePostModal"-->
<!--                       th:data-post-id="${post.id}" >-->
<!--                        <i class="fa-solid fa-xmark"></i> </a>-->
<!--                </td>-->

            </tr>

            </tbody>
        </table>
    </div>
    <!-- Modal Xóa Người Dùng -->
    <div class="modal fade" id="deletePostModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="deletePostForm" th:action="@{/admin/post/delete}" method="post">
                    <input type="hidden" name="_method" value="DELETE" />
                    <input type="hidden" id="postId" name="postId" />

                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Delete</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete ?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script >
        document.getElementById('deletePostModal').addEventListener('show.bs.modal', function (event) {

            const button = event.relatedTarget;

            const postId = button.getAttribute('data-post-id');

            document.getElementById('postId').value = postId;
        });
    </script>
</div>
