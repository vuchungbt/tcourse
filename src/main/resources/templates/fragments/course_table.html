<div th:fragment="posts" class="card mb-4">
    <div class="card-header ">
        <div>
            <i class="fas fa-table me-1"></i>
            Khóa học
        </div>
    </div>

    <div class="card-body">
        <table id="datatablesSimple">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Giá bán</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">

                <td th:text="${post.id}"></td>
                <td th:text="${post.name}"></td>
                <td th:text="${post.price}"></td>

                <td>
                    <a href="#" class="mx-2 text-primary text-decoration-none"> <i class="fa-regular fa-pen-to-square"></i> </a>
                    <a href="#" class="mx-2 text-danger text-decoration-none"><i class="fa-solid fa-xmark"></i> </a>
                    <a href="#" class="mx-2 text-secondary text-decoration-none"><i class="fa-solid fa-ellipsis"></i> </a>
                </td>

            </tr>

            </tbody>
        </table>
    </div>
</div>
