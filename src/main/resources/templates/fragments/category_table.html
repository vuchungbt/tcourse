<div th:fragment="category" class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <i class="fas fa-table me-1"></i>
            Category
        </div>
        <div class="d-flex justify-content-between align-items-center ">
            <a class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addCateModal">
                <i class="fa-solid fa-plus"></i> Thêm
            </a>
        </div>
    </div>

    <div class="card-body">
        <table id="datatablesSimple">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Mô tả</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category: ${categories}">

                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>
                <td th:text="${category.description}"></td>
                <td >
                        <a href="#" class="mx-2 text-primary text-decoration-none"
                            data-bs-toggle="modal"
                            data-bs-target="#editCateModal"
                            th:data-cate-id="${category.id}">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </a>

                        <a href="#" class="mx-2 text-danger text-decoration-none"
                           data-bs-toggle="modal"
                           data-bs-target="#deleteCateModal"
                           th:data-cate-id="${category.id}"
                           th:data-cate-description="${category.description}"
                           th:data-cate-name="${category.name}">
                            <i class="fa-solid fa-xmark"></i> </a>

                </td>

            </tr>

            </tbody>
        </table>
    </div>
    <!-- Modal Thêm Người Dùng -->
    <div class="modal fade" id="addCateModal" tabindex="-1" aria-labelledby="addCateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCateModalLabel">Thêm danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/category/create}" th:method="post">
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Tên</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="description" class="form-label">Tô tả</label>
                                <input type="text" class="form-control" id="description" name="description" placeholder="description" required>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Modal Xóa  -->
    <div class="modal fade" id="deleteCateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="deleteCateForm" th:action="@{/admin/category/delete}" method="post">
                    <input type="hidden" name="_method" value="DELETE" />
                    <input type="hidden" id="cateId" name="cateId" />

                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Delete </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Bạn muốn xóa danh mục  ? Lưu ý chỉ danh mục trống mới được xóa!
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- editCateModal Modal -->
    <div class="modal fade" id="editCateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editCateForm" th:action="@{/api/category/update}" method="post">
                    <input type="hidden" id="editCateId" name="id" />

                    <div class="modal-header">
                        <h5 class="modal-title">Edit Category Information</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <!-- Loading spinner -->
                        <div id="loadingSpinner" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div id="editForm">
                            <div class="row align-items-center">
                                <!-- Cột chứa form -->
                                <div class="col-md-9">
                                    <div class="mb-3">
                                        <label for="editName" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="editName" name="name" required>
                                    </div>
                                </div>
                                <!-- Cột chứa form -->
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label for="editDescription" class="form-label">Description</label>
                                        <textarea class="form-control" id="editDescription" name="description" rows="3"></textarea>

                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script >
        document.getElementById('deleteCateModal').addEventListener('show.bs.modal', function (event) {

            const button = event.relatedTarget;

            const cateId = button.getAttribute('data-cate-id');

            document.getElementById('cateId').value = cateId;
        });
    </script>

    <!-- JavaScript for handling the edit modal -->
    <script>
        document.getElementById('editCateModal').addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const cateId = button.getAttribute('data-cate-id');

            const editCateIdElement = document.getElementById('editCateId');
            if (editCateIdElement) {
                editCateIdElement.value = cateId;
            }

            if (editCateIdElement) {
                console.log('editCateIdElement', editCateIdElement.value);
            } else {
                console.log('editCateIdElement null');
            }

            // Show loading spinner and hide form
            const loadingSpinner = document.getElementById('loadingSpinner');
            const editForm = document.getElementById('editForm');
            loadingSpinner.classList.remove('d-none');
            editForm.classList.add('d-none');

            // Fetch data
            fetch(`/api/category/${cateId}`)
                .then(response => {
                    console.log('response ::', response);
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(category => {
                    console.log('category :', category);
                    // Fill form with user data
                    document.getElementById('editName').value = category.name || '';
                    document.getElementById('editDescription').value = category.description || '';

                    const avatarPreview = document.getElementById('avatarPreview');

                    loadingSpinner.classList.add('d-none');
                    editForm.classList.remove('d-none');
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading category data');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editCateModal'));
                    modal.hide();
                });
        });


        // Form submission with Ajax
        document.getElementById('editCateForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(this);
            const cateIdx = document.getElementById('editCateId');
            if (cateIdx) {
                console.log('cateIdx', cateIdx.value);
                cateId = cateIdx.value;
            } else {
                console.log('cateIdx null');
            }

            // Convert form data to JSON
            const jsonData = Object.fromEntries(formData.entries());

            // Add loading state to submit button
            const submitButton = this.querySelector('button[type="submit"]');
            const originalButtonText = submitButton.innerHTML;
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

            fetch(`/api/category/update/${cateId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(jsonData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Show success message
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editCateModal'));
                    modal.hide();

                    // Optionally refresh the page or update the table row
                    window.location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error updating');
                })
                .finally(() => {
                    // Reset button state
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalButtonText;
                });
        });
    </script>


</div>
