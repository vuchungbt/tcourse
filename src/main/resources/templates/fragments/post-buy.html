<div th:fragment="list_post_all" class="my-3">
    <div class="row my-2">
        <div class="d-flex justify-content-between align-items-center">
            <h4  >Đã mua</h4>
        </div>
    </div>

    <div th:if="${post_buy.size() > 0}" class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="post : ${post_buy}" class="col">
            <div class="card h-100 position-relative">
                <img th:src="@{'/image/' + ${post.thumbnail}}" class="card-img-top" height="200px" alt="Product 1">
                <div class="card-body">
                    <a th:href="@{'/home/p/' +${post.id}}">
                        <h5 class="card-title" th:text="${post.name}"></h5>
                        <p class="card-text" th:text="${post.content}">Mô tả ngắn gọn về sản phẩm 1.</p>
                    </a>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-primary num" th:text="${post.finalPrice + ' VND'}">$150</span>
                    <div class="text-warning">
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-half"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
