<div th:fragment="invoice" class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <i class="fas fa-table me-1"></i>
            Hóa đơn
        </div>

        <div class="d-flex justify-content-between align-items-center ">
            <a class="btn btn-outline-primary btn-sm"  >  Tổng:
            </a>
        </div>
    </div>

    <div class="card-body">
        <table id="datatablesSimple">
            <thead>
            <tr>
                <th>ID</th>
                <th>Học viên</th>
                <th>Số tiền</th>
                <th>Số lượng</th>
                <th>Ngày</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invoice: ${invoices}">

                <td th:text="${invoice.id}"></td>
                <td th:text="${invoice.created.name}"></td>
                <td th:text="${invoice.total}"></td>
                <td th:text="${invoice.detailList.size()}"></td>
                <td th:text="${invoice.createAt}"></td>
                <td>
                    <a href="#" class="mx-2 text-primary text-decoration-none"
                       data-bs-toggle="modal"
                       data-bs-target="#editUserModal"
                       th:data-user-id="${user.id}">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </a>

                    <a href="#" class="mx-2 text-danger text-decoration-none"
                       data-bs-toggle="modal"
                       data-bs-target="#deleteUserModal"
                       th:data-user-id="${user.id}"
                       th:data-user-name="${user.username}">
                        <i class="fa-solid fa-xmark"></i> </a>
                    <a href="#" class="mx-2 text-secondary text-decoration-none"><i class="fa-solid fa-ellipsis"></i> </a>
                </td>

            </tr>

            </tbody>
        </table>
    </div>

</div>
