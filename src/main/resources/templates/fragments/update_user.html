
<div  th:fragment="info" class="row">
  <div class="col-lg-3">

    <div class="d-flex align-items-center mb-4 d-lg-none">
      <button class="border-0 bg-transparent" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
        <span class="btn btn-primary"><i class="fa-solid fa-sliders-h" aria-hidden="true"></i></span>
        <span class="h6 mb-0 fw-bold d-lg-none ms-2">Settings</span>
      </button>
    </div>
    <nav class="navbar navbar-light navbar-expand-lg mx-0">
      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar">
        <!-- Offcanvas header -->
        <div class="offcanvas-header">
          <button type="button" class="btn-close text-reset ms-auto" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <!-- Offcanvas body -->
        <div class="offcanvas-body ">
          <!-- Card START -->
          <div class="card w-100">
            <!-- Card body START -->
            <div class="card-body">

              <!-- Side Nav START -->
              <ul class="nav nav-tabs nav-pills nav-pills-soft flex-column fw-bold gap-2 border-0">
                <li class="nav-item" data-bs-dismiss="offcanvas">
                  <a class="nav-link d-flex mb-0 active" href="#nav-setting-tab-1" data-bs-toggle="tab">
                    <i class="bi bi-person-vcard mx-1"></i>
                    <span>Cập nhật thông tin </span></a>
                </li>
                <li class="nav-item" data-bs-dismiss="offcanvas">
                  <a class="nav-link d-flex mb-0" href="#nav-setting-tab-2" data-bs-toggle="tab">
                    <i class="bi bi-envelope-check mx-1"></i>
                    <span>Tài khoản </span></a>
                </li>
                <li class="nav-item" data-bs-dismiss="offcanvas">
                  <a class="nav-link d-flex mb-0" href="#nav-setting-tab-3" data-bs-toggle="tab">
                    <i class="bi bi-key  mx-1"></i>
                    <span>Đổi mật khẩu </span></a>
                </li>
                <li class="nav-item" data-bs-dismiss="offcanvas">
                  <a class="nav-link d-flex mb-0" href="#nav-setting-tab-4" data-bs-toggle="tab">
                    <i class="bi bi-bell-slash  mx-1"></i>
                    <span>Cài đặt thông báo </span></a>
                </li>

              </ul>

            </div>
            <div class="card-footer text-center py-2">
              <a class="btn btn-link text-secondary btn-sm" href="#!">View Profile </a>
            </div>
          </div>
          <!-- Card END -->
        </div>
      </div>
    </nav>
  </div> 
  <div class="col-lg-6 vstack gap-4">
    <!-- Setting Tab content START -->
    <div class="tab-content pt-2">

      <!-- Account setting tab START -->
      <div class="tab-pane show active fade" id="nav-setting-tab-1">
        <!-- Account settings START -->
        <div class="card mb-4">

          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Tên</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập tên">
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="tel" class="form-label">Số điện thoại</label>
                  <input type="tel" class="form-control" id="tel" placeholder="Nhập số điện thoại">
                </div>
                <div class="col-md-6">
                  <label for="dob" class="form-label">Ngày sinh</label>
                  <input type="date" class="form-control" id="dob">
                </div>
              </div>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" placeholder="Giới thiệu">
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Nhập mô tả"></textarea>
              </div>
              <button type="submit" class="btn btn-primary float-end">Cập nhật</button>
            </form>

          </div>
          <!-- Card body END -->
        </div>

      </div>
      <!-- Notification tab START -->
      <div class="tab-pane fade" id="nav-setting-tab-2">
        <!-- Notification START -->
        <div class="card">
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email">
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Nhập username">
              </div>
              <button type="submit" class="btn btn-primary float-end">Cập nhật</button>
            </form>
          </div>
        </div>
        <!-- Notification END -->
      </div>
      <!-- Notification tab END -->

      <!-- Privacy and safety tab START -->
      <div class="tab-pane fade" id="nav-setting-tab-3">
        <!-- Privacy and safety START -->
        <div class="card">
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="current-password" class="form-label">Mật khẩu cũ</label>
                <input type="password" class="form-control" id="current-password" placeholder="Nhập mật khẩu cũ">
              </div>
              <div class="mb-3">
                <label for="new-password" class="form-label">Mật khẩu mới</label>
                <input type="password" class="form-control" id="new-password" placeholder="Nhập mật khẩu mới">
              </div>
              <div class="mb-3">
                <label for="confirm-password" class="form-label">Nhập lại mật khẩu</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Nhập lại mật khẩu mới">
              </div>
              <button type="submit" class="btn btn-primary float-end">Cập nhật</button>
            </form>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="nav-setting-tab-4">
        <div class="card">
          <div class="card-header border-0 pb-0">
            <h5 class="card-title">Chức năng thêm</h5>
          </div>
          <div class="card-body">
          </div>
          <div class="card-footer pt-0 text-end border-0">
            <button type="submit" class="btn btn-sm btn-primary mb-0">Save changes</button>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="nav-setting-tab-6">
        <!-- Card START -->
        <div class="card">
          <!-- Card header START -->
          <div class="card-header border-0 pb-0">
            <h5 class="card-title">Delete account</h5>
            <p class="mb-0">He moonlights difficult engrossed it, sportsmen. Interested has all Devonshire difficulty gay assistance joy. Unaffected at ye of compliment alteration to.</p>
          </div>
          <!-- Card header START -->
          <!-- Card body START -->
          <div class="card-body">
          </div>
          <!-- Card body END -->
        </div>
        <!-- Card END -->
      </div>

    </div>
  </div>

</div>
