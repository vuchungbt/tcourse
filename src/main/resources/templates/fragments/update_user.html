        <!-- Account settings START -->
        <div class="card mb-4">

          <div class="card-body">
            <form id="infoUserForm">
              <input type="hidden" name="post_id" th:value="${user.id}">
              <input type="hidden" th:value="${user.id}" id="editUserId" name="id" />
              <div class="mb-3">
                <label for="name" class="form-label">Tên</label>
                <input type="text" th:value="${user.name}" name="name" class="form-control" id="name" placeholder="Nhập tên">
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="tel" class="form-label">Số điện thoại</label>
                  <input th:value="${user.tel}" type="tel" name="tel" class="form-control" id="tel" placeholder="Nhập số điện thoại">
                </div>
                <div class="col-md-6">
                  <label for="dob" class="form-label">Ngày sinh</label>
                  <input th:value="${user.dob}" type="date" name="dob" class="form-control" id="dob">
                </div>
              </div>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" th:value="${user.title}" name="title" class="form-control" id="title" placeholder="Giới thiệu">
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" th:text="${user.description}" name="description"   id="description" rows="3" placeholder="Nhập mô tả">

                </textarea>
              </div>
              <button type="submit" class="btn btn-primary float-end">Cập nhật</button>
            </form>

          </div>
          <!-- Card body END -->
        </div>
        <script>
          document.getElementById('infoUserForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const userId = document.getElementById('editUserId').value;

            // Convert form data to JSON
            const jsonData = Object.fromEntries(formData.entries());

            // Add loading state to submit button
            const submitButton = this.querySelector('button[type="submit"]');
            const originalButtonText = submitButton.innerHTML;
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

            fetch(`/api/users/update/${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(jsonData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                // Show success message
                // const modal = bootstrap.Modal.getInstance(document.getElementById('editUserModal'));
               // modal.hide();
                alert(data.message);
                // Optionally refresh the page or update the table row
                // window.location.reload();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error updating user');
            })
            .finally(() => {
                // Reset button state
                submitButton.disabled = false;
                submitButton.innerHTML = originalButtonText;
            });
        });
        </script>

      <div class="tab-pane fade" id="nav-setting-tab-3">

        <div class="card">
          <div class="card-body">
            <form id="pwdForm">
              <input type="hidden" th:value="${user.id}" name="id" id="pwdId"  >
              <div class="mb-3">
                <label for="current-password" class="form-label">Mật khẩu cũ</label>
                <input type="password" value="" name="old_password" class="form-control" id="current-password" placeholder="Nhập mật khẩu cũ">
              </div>
              <div class="mb-3">
                <label for="new-password" class="form-label">Mật khẩu mới</label>
                <input type="password" value="" name="password" class="form-control" id="new-password" placeholder="Nhập mật khẩu mới">
              </div>
              <div class="mb-3">
                <label for="confirm-password" class="form-label">Nhập lại mật khẩu</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Nhập lại mật khẩu mới">
                <p class="message" id="message"> </p>
              </div>
              <button type="submit" class="btn btn-primary float-end">Cập nhật</button>
            </form>
          </div>
        </div>
        <script>
          const currentPasswordInput = document.getElementById('current-password');
          const newPasswordInput = document.getElementById('new-password');
          const confirmPasswordInput = document.getElementById('confirm-password');
          const message = document.getElementById('message');

          function validatePasswords() {
            const currentPassword = currentPasswordInput.value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword === currentPassword) {
              message.textContent = ' Mật khẩu ít nhất có 6 kí tự!';
              message.style.color = 'green';
            } else if (newPassword !== confirmPassword) {
              message.textContent = 'Mật khẩu không khớp!';
              message.style.color = 'red';
            } else {
              message.textContent = '';
            }
          }

          newPasswordInput.addEventListener('input', validatePasswords);
          confirmPasswordInput.addEventListener('input', validatePasswords);
        </script>

        <script>
          const switches = document.querySelectorAll('.form-check-input');
          switches.forEach(switchElement => {
              switchElement.addEventListener('change', () => {
                  if (switchElement.checked) {
                      switches.forEach(otherSwitch => {
                          if (otherSwitch !== switchElement) {
                              otherSwitch.checked = false;
                          }
                      });
                  }
              });
          });
        </script>
