<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Course | T-course Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="/admin/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">

<div th:replace="~{fragments/admin_nav :: nav}"></div>

<div id="layoutSidenav">
    <div th:replace="~{fragments/admin_side :: side_nav}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Invoice</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item active" th:text="${param.i}"></li>
                </ol>
                <div class="row">
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body py-4">Lượt mua: <span th:text="${buy}"> </span></div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body py-4">Tổng cộng: <span th:text="${total}" class="num"> </span></div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body py-4">Tổng khóa học: <span th:text="${count}" > </span></div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body py-4">Học viên: <span th:text="${stu}" > </span> </div>
                        </div>
                    </div>
                </div>

                <div th:replace="~{fragments/invoice_table :: invoice}"></div>

            </div>
        </main>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/admin/js/scripts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js" crossorigin="anonymous"></script>
<script src="/admin/js/datatables-simple-demo.js"></script>
<script>
    function formatNumberWithDot(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }
    function timeAgo(date) {
        const now = new Date();
        const timeDiff = now - new Date(date);
        const seconds = Math.floor(timeDiff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        const weeks = Math.floor(days / 7);

        if (weeks >= 1) {
            return new Date(date).toLocaleString();
        } else if (days > 0) {
            return `${days} ngày trước`;
        } else if (hours > 0) {
            return `${hours} giờ trước`;
        } else if (minutes > 0) {
            return `${minutes} phút trước`;
        } else {
            return `${seconds} giây trước`;
        }
    }
    document.addEventListener('DOMContentLoaded', function () {
        const elements = document.querySelectorAll(".num");
        elements.forEach(el => {
            const text = el.textContent.trim(); // Lấy nội dung văn bản
            const [value, unit] = text.split(" "); // Tách số và đơn vị
            const formattedValue = formatNumberWithDot(value); // Định dạng số
            el.textContent = `${formattedValue} ${unit || ""}`; // Ghép lại số và đơn vị
        });

        const timestamps = document.querySelectorAll(".timestamps");
        console.log('timestamps: ', timestamps)
        timestamps.forEach(timestamp => {
            console.log('timestamp: ', timestamp)
            const originalText = timestamp.textContent;
            timestamp.textContent = timeAgo(originalText);
        });
        });
</script>
</body>
</html>
